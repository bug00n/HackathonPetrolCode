repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.1
    hooks:
      - id: mypy
        files: ^source/
        exclude: /ut/
        additional_dependencies:
          - pydantic>=2.6.0
          - pandas-stubs>=2.2.0
        args:
          - --config-file=pyproject.toml
          - --exclude=/ut/
        stages: [pre-commit]