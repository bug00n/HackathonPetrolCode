name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip' # Кэширует pip-пакеты для ускорения сборки

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: Run Ruff (Formatting & Linting)
        run: |
          ruff format --check .
          ruff check .

      - name: Run mypy
        run: mypy source

      - name: Run Pytest (Windows desktop)
        if: runner.os == 'Windows'
        run: python -m pytest

      - name: Run Pytest (Linux virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest

      - name: Run deterministic acceptance episodes
        run: |
          python -m source.main validate-stage0
          python -m source.main acceptance --output reports/ci-acceptance
